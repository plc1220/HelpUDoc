gates:
  - gate_id: presentation_context
    presentation: questionnaire
    required: true
    synthetic_on_pending: true
    props:
      title: Choose Deck Mode
      description: Choose how the presentation will be consumed. Everything else is inferred from your request and source material.
      submitLabel: Continue
    context:
      skill: frontend-slides
      skillId: frontend-slides
      gateId: presentation_context
      interactionContract: helpudoc.interaction
      expectedPresentation: questionnaire
  - gate_id: style_preview_selection
    presentation: style_preview
    required: true
    synthetic_on_pending: true
    props:
      title: Choose Presentation Style
      description: Select a generated style preview.
      submitLabel: Use selected style
    context:
      skill: frontend-slides
      skillId: frontend-slides
      gateId: style_preview_selection
      interactionContract: helpudoc.interaction
      expectedPresentation: style_preview
artifacts:
  - artifact_id: final_deck
    type: html_deck
    required: true
    patterns:
      - "**/*-deck.html"
    path_regex: "(^|/)(?!style-[a-c]\\.html$)(?!.*(?:slide-previews)/)[^/]+\\.html$"
    description: Final HTML presentation deck generated after all required Interaction gates are complete.
    instructions: Write a final .html slide deck outside the temporary slide-previews directory, with multiple viewport-sized slide sections such as <section class="slide"> and keyboard/scroll navigation; when possible, its filename ends with -deck.html
  - artifact_id: final_pptx
    type: pptx_deck
    required: false
    patterns:
      - "**/*-deck.pptx"
      - "**/*-presentation.pptx"
    path_regex: "(^|/)[^/]+-(deck|presentation)\\.pptx$"
    description: Optional PowerPoint export generated from the HTML deck when the user asks for one.
    instructions: When the user requests PowerPoint export after the HTML deck is complete, call run_skill_python_script with script_name="export-pptx", input_paths including the HTML deck, and args containing the HTML deck path and desired .pptx output path. The output filename should end with -deck.pptx or -presentation.pptx.
