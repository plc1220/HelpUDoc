}

.review-item.active {
  background: #eff6ff;
  border-left: 3px solid #2563eb;
}

.review-item span strong,
.review-item span small,
.review-item span em {
  display: block;
}

.review-item span strong {
  font-size: 9px;
}

.review-item span small {
  color: #64748b;
  font-size: 7px;
  margin-top: 3px;
}

.review-item span em {
  color: #2563eb;
  font-size: 7px;
  font-style: normal;
  margin-top: 5px;
}

.review-detail {
  min-width: 0;
  overflow-y: auto;
  padding: 16px;
}

.review-title {
  align-items: start;
  display: flex;
  justify-content: space-between;
}

.review-title small {
  color: #2563eb;
  font-size: 7px;
  font-weight: 750;
  text-transform: uppercase;
}

.review-title h2 {
  font-size: 19px;
  margin: 4px 0;
}

.review-title p {
  color: #64748b;
  font-size: 8px;
  margin: 0;
}

.review-meta {
  background: #f8fafc;
  border: 1px solid var(--line);
  border-radius: 9px;
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(4, 1fr);
  margin: 14px 0;
  padding: 10px;
}

.review-meta span,
.review-meta strong {
  display: block;
}

.review-meta span {
  color: #98a2b3;
  font-size: 7px;
}

.review-meta strong {
  font-size: 8px;
  margin-top: 3px;
}

.green-text {
  color: #047857;
}

.review-section {
  border: 1px solid var(--line);
  border-radius: 9px;
  margin-bottom: 11px;
  overflow: hidden;
}

.review-section-head {
  align-items: center;
  background: #f8fafc;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  padding: 8px 10px;
}

.review-section-head strong {
  font-size: 8px;
}

.review-section-head span {
  color: #98a2b3;
  font-size: 7px;
}

.permission-row {
  align-items: center;
  border-bottom: 1px solid var(--soft-line);
  display: grid;
  gap: 8px;
  grid-template-columns: 24px 1fr auto;
  padding: 8px 10px;
}

.permission-row:last-child {
  border-bottom: 0;
}

.permission-row > .glyph {
  background: #f1f5f9;
  border-radius: 6px;
  height: 24px;
  width: 24px;
}

.permission-row span strong,
.permission-row span small {
  display: block;
}

.permission-row span strong {
  font-size: 8px;
}

.permission-row span small {
  color: #64748b;
  font-size: 7px;
  margin-top: 2px;
}

.check-grid {
  display: grid;
  gap: 6px;
  grid-template-columns: 1fr 1fr;
  padding: 10px;
}

.check-grid span {
  color: #047857;
  font-size: 8px;
}

.assignment-pane {
  border-left: 1px solid var(--line);
  padding: 14px;
}

.assignment-pane > div > small {
  color: #2563eb;
  font-size: 7px;
  font-weight: 750;
  text-transform: uppercase;
}

.assignment-pane h3 {
  font-size: 15px;
  margin: 4px 0 6px;
}

.assignment-pane > div > p {
  color: #64748b;
  font-size: 8px;
  line-height: 1.5;
}

.assignment-pane label {
  color: #475569;
  display: block;
  font-size: 8px;
  font-weight: 700;
  margin: 15px 0;
}

.assignment-pane select,
.group-select {
  background: white;
  border: 1px solid var(--line);
  border-radius: 7px;
  display: flex;
  font-size: 8px;
  margin-top: 5px;
  padding: 8px;
  width: 100%;
}

.group-select {
  align-items: center;
  background: #eff6ff;
  color: #1d4ed8;
  justify-content: space-between;
}

.group-select button {
  background: transparent;
  border: 0;
  color: #1d4ed8;
}

.review-actions {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 18px;
}

.review-actions button {
  background: white;
  border: 1px solid var(--line);
  border-radius: 7px;
  font-size: 8px;
  font-weight: 720;
  padding: 8px;
}

.runtime-columns {
  grid-template-columns: 202px minmax(500px, 1fr) 310px;
}

.runtime-canvas {
  background: #f5f7fa;
  min-width: 0;
  overflow-y: auto;
  padding: 18px;
}

.runtime-title {
  align-items: start;
  display: flex;
  justify-content: space-between;
}

.runtime-title small {
  color: #2563eb;
  font-size: 7px;
  font-weight: 750;
  text-transform: uppercase;
}

.runtime-title h2 {
  font-size: 20px;
  margin: 4px 0;
}

.runtime-title p {
  color: #64748b;
  font-size: 8px;
  margin: 0;
}

.runtime-toggle {
  background: #e8edf4;
  border-radius: 8px;
  display: inline-flex;
  gap: 3px;
  margin: 14px 0;
  padding: 3px;
}

.runtime-toggle button {
  background: transparent;
  border: 0;
  border-radius: 6px;
  color: #64748b;
  font-size: 8px;
  padding: 6px 8px;
}

.runtime-toggle button.active {
  background: white;
  box-shadow: 0 2px 7px rgba(15, 23, 42, 0.08);
  color: #047857;
  font-weight: 720;
}

.runtime-toggle button.active.danger {
  color: #b91c1c;
}

.auth-checks {
  background: white;
  border: 1px solid var(--line);
  border-radius: 9px;
  overflow: hidden;
}

.auth-checks > div {
  align-items: center;
  border-bottom: 1px solid var(--soft-line);
  display: grid;
  gap: 10px;
  grid-template-columns: 30px 1fr auto;
  padding: 8px 10px;
}

.auth-checks > div:last-child {
  border-bottom: 0;
}

.auth-checks > div.failed-check {
  background: #fef2f2;
}

.check-number {
  align-items: center;
  background: #f1f5f9;
  border-radius: 6px;
  color: #64748b;
  display: flex;
  font-family: var(--font-geist-mono), monospace;
  font-size: 7px;
  height: 25px;
  justify-content: center;
  width: 25px;
}

.auth-checks p {
  margin: 0;
}

.auth-checks p strong,
.auth-checks p small {
  display: block;
}

.auth-checks p strong {
  font-size: 8px;
}

.auth-checks p small {
  color: #64748b;
  font-size: 7px;
  margin-top: 2px;
}

.sandbox-envelope {
  align-items: center;
  background: #111827;
  border-radius: 9px;
  color: white;
  display: flex;
  justify-content: space-between;
  margin-top: 11px;
  padding: 10px;
}

.sandbox-envelope > div {
  align-items: center;
  display: flex;
  gap: 7px;
}

.sandbox-envelope strong,
.sandbox-envelope small {
  display: block;
}

.sandbox-envelope strong {
  font-size: 8px;
}

.sandbox-envelope small {
  color: #9ca3af;
  font-size: 7px;
  margin-top: 2px;
}

.sandbox-envelope > div:last-child span {
  background: #273348;
  border-radius: 5px;
  color: #cbd5e1;
  font-size: 7px;
  padding: 5px 6px;
}

.run-actions {
  align-items: center;
  display: flex;
  justify-content: space-between;
  margin-top: 12px;
}

.run-actions p {
  color: #64748b;
  font-size: 8px;
}

.run-actions button {
  border: 1px solid;
  border-radius: 7px;
  font-size: 8px;
  font-weight: 720;
  padding: 8px 10px;
}

.blocked-action {
  background: #dc2626;
  border-color: #dc2626;
  color: white;
}

.prototype-toast {
  align-items: center;
  background: #111827;
  border: 1px solid #334155;
  border-radius: 9px;
  bottom: 24px;
  box-shadow: 0 15px 40px rgba(15, 23, 42, 0.25);
  color: white;
  display: flex;
  font-size: 10px;
  gap: 8px;
  left: 50%;
  padding: 11px 14px;
  position: fixed;
  transform: translateX(-50%);
  z-index: 100;
}

.prototype-toast span {
  align-items: center;
  background: #047857;
  border-radius: 50%;
  display: flex;
  height: 19px;
  justify-content: center;
  width: 19px;
}

@media (max-width: 1120px) {
  .prototype-toolbar {
    grid-template-columns: 220px 1fr auto;
  }

  .workspace-drawer,
  .settings-sidebar {
    display: none;
  }

  .workspace-columns {
    grid-template-columns: 180px minmax(340px, 1fr) 280px;
  }

  .skill-workbench {
    grid-template-columns: 230px minmax(360px, 1fr);
  }

  .builder-pane {
    display: none;
  }

  .review-layout {
    grid-template-columns: 220px minmax(400px, 1fr);
  }

  .assignment-pane {
    display: none;
  }
}

@media (max-width: 820px) {
  .prototype-page {
    overflow: auto;
  }

  .prototype-toolbar {
    align-items: center;
    grid-template-columns: 1fr auto;
    height: auto;
    min-height: 68px;
    padding: 10px;
  }

  .scenario-tabs {
    grid-column: 1 / -1;
    grid-row: 2;
    order: 3;
  }

  .scenario-context > p,
  .demo-note {
    display: none;
  }

  .app-stage {
    height: 720px;
    padding: 7px;
  }

  .product-rail,
  .file-pane {
    display: none;
  }

  .workspace-columns,
  .runtime-columns {
    grid-template-columns: minmax(360px, 1fr) 280px;
  }

  .workspace-header {
    gap: 8px;
  }

  .workspace-identity > .status-chip,
  .workspace-actions > button:not(.primary-action) {
    display: none;
  }

  .document-page {
    padding: 24px;
  }

  .finding-grid {
    grid-template-columns: 1fr;
  }

  .skill-workbench {
    grid-template-columns: 1fr;
  }

  .skill-list-pane {
    display: none;
  }

  .review-layout {
    grid-template-columns: 1fr;
  }

  .review-queue {
    display: none;
  }
}
