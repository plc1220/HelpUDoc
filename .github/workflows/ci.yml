name: CI

on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - name: Intentional failure for issue 104 merge-protection proof
        run: exit 1
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify CI gate semantics
        run: python3 -m unittest discover -s .github/scripts -p 'test_ci_gate.py' -v
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'packages/contracts/**'
              - 'infra/gke/**'
              - 'infra/env/**'
              - 'env/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/calendar-review-follow-up.yml'
            frontend:
              - 'frontend/**'
              - 'packages/shared/**'
              - 'packages/contracts/**'
              - 'packages/dashboard-runtime/**'
              - 'infra/env/**'
              - 'env/**'
              - '.github/workflows/ci.yml'
            agent:
              - 'agent/**'
              - 'skills/**'
              - 'plugins/**'
              - '.dockerignore'
              - '.github/scripts/**'
              - '.github/workflows/deploy-agent-gke.yml'
              - '.github/workflows/deploy-gke.yml'
              - 'infra/cloudbuild.yaml'
              - 'tests/test_agent_*.py'
              - 'tests/test_mcp_binding.py'
              - 'tests/test_tool_factory.py'
              - 'tests/test_skill_sandbox.py'
              - 'tests/office/**'
              - 'infra/env/**'
              - 'env/**'
              - '.github/workflows/ci.yml'

  backend-test:
    name: Backend tests
    needs: [changes]
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
      || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run validate:env
      - run: npm test

  calendar-review-tests:
    name: Calendar review follow-up acceptance
    needs: [changes]
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
      || needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/calendar-review-follow-up.yml

  frontend:
    name: Frontend lint and build
    needs: [changes]
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
      || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Match the successful frontend image build's heap budget.
          NODE_OPTIONS: --max-old-space-size=6144

  python-agent:
    name: Python agent smoke and core tests
    needs: [changes]
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
      || needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements-runtime.lock
      - name: Verify resolved dependencies on both Linux architectures
        run: |
          pip install uv==0.11.2
          python agent/scripts/update_runtime_lock.py --check
      - name: Install resolved agent dependencies
        # pytest and pytest-asyncio are included in the resolved dependency set.
        run: >-
          pip install --require-hashes --only-binary=:all: -r agent/requirements-runtime.lock
      - name: Run agent tests
        env:
          PYTHONPATH: agent
        run: |
          python -m pytest \
            tests/test_agent_import_smoke.py \
            tests/test_agent_configuration.py \
            tests/test_mcp_binding.py \
            tests/test_tool_factory.py \
            tests/test_skill_sandbox.py \
            agent/tests/test_document_quick_edit.py \
            agent/tests/test_office_preview.py \
            agent/tests/test_team_thread_history_tool.py \
            tests/office

  docker-backend:
    name: Docker build validation (backend)
    needs: [changes]
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
      || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.gke
          push: false
          tags: helpudoc-backend:ci-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  docker-frontend:
    name: Docker build validation (frontend)
    needs: [changes]
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
      || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile.gke
          push: false
          tags: helpudoc-frontend:ci-${{ github.sha }}
          build-args: |
            VITE_GOOGLE_CLIENT_ID=dummy
            VITE_AUTH_MODE=hybrid
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  docker-agent:
    name: Docker build validation (agent)
    needs: [changes]
    # Image-input PRs must build and run both supported architectures.
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
      || needs.changes.outputs.agent == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile.gke
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: helpudoc-agent:ci-smoke
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=agent-${{ matrix.arch }}
          cache-to: type=gha,scope=agent-${{ matrix.arch }},mode=max
      - name: Smoke imports, OfficeCLI and startup inside loaded image
        run: |
          (cd agent/licenses/officecli && sha256sum -c SHA256SUMS)
          docker run --rm --network none helpudoc-agent:ci-smoke python -m pip check
          docker run --rm --network none helpudoc-agent:ci-smoke python /app/agent/scripts/smoke_import.py
          docker run --rm --network none helpudoc-agent:ci-smoke python /app/agent/scripts/smoke_image.py
          docker run --rm --network none helpudoc-agent:ci-smoke officecli --version
          docker run --rm --network none helpudoc-agent:ci-smoke python /app/agent/scripts/smoke_officecli.py
          docker run --rm --network none helpudoc-agent:ci-smoke python /app/agent/scripts/smoke_office_preview.py
          docker run --rm --network none helpudoc-agent:ci-smoke sh -c \
            'cd /app/agent/licenses/officecli && sha256sum -c SHA256SUMS'

  ci-gate:
    name: CI status
    needs:
      - changes
      - backend-test
      - calendar-review-tests
      - frontend
      - python-agent
      - docker-backend
      - docker-frontend
      - docker-agent
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require successful detection and every applicable job
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_gate.py
