name: RustFS migration rehearsal

on:
  pull_request:
    paths:
      - 'scripts/migrate_minio_to_rustfs.sh'
      - 'tests/rustfs/**'
      - 'infra/docker-compose.dependencies.yml'
      - '.github/workflows/rustfs-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    name: Rehearse both buckets and failure handling
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check shell and inject writer and verifier failures
        run: |
          bash -n scripts/migrate_minio_to_rustfs.sh tests/rustfs/migration-rehearsal.sh
          python3 tests/rustfs/mock-migrate-minio-to-rustfs.py
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Exercise migration with disposable MinIO and RustFS
        run: bash tests/rustfs/migration-rehearsal.sh
