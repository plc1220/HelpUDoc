name: Deploy Agent to GKE

concurrency:
  group: deploy-gke-agent-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_LOCATION: ${{ secrets.GKE_LOCATION }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  USE_GKE_GCLOUD_AUTH_PLUGIN: "True"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Google auth mode
        id: auth_mode
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          has_wif=false
          has_json=false
          if [[ -n "${WIF_PROVIDER}" && -n "${WIF_SERVICE_ACCOUNT}" ]]; then has_wif=true; fi
          if [[ -n "${CREDENTIALS_JSON}" ]]; then has_json=true; fi
          if [[ "${has_wif}" == "true" && "${has_json}" == "true" ]]; then
            echo "Configure only one auth method: WIF OR JSON key." >&2
            exit 1
          fi
          if [[ "${has_wif}" == "true" ]]; then echo "mode=wif" >> "${GITHUB_OUTPUT}"; exit 0; fi
          if [[ "${has_json}" == "true" ]]; then echo "mode=json" >> "${GITHUB_OUTPUT}"; exit 0; fi
          echo "Missing GCP auth secrets." >&2
          exit 1

      - name: Authenticate to Google Cloud (Workload Identity)
        if: ${{ steps.auth_mode.outputs.mode == 'wif' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (Service Account Key)
        if: ${{ steps.auth_mode.outputs.mode == 'json' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker Auth
        run: |
          set -euo pipefail
          gcloud auth configure-docker gcr.io --quiet

      - name: Get GKE Credentials
        run: |
          set -euo pipefail
          gcloud container clusters get-credentials "${GKE_CLUSTER}" --location "${GKE_LOCATION}" --project "${PROJECT_ID}"

      - name: Build and Push Agent Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -f agent/Dockerfile.gke -t "gcr.io/${PROJECT_ID}/helpudoc-agent:${IMAGE_TAG}" .
          docker run --rm "gcr.io/${PROJECT_ID}/helpudoc-agent:${IMAGE_TAG}" python /app/agent/scripts/smoke_import.py
          docker run --rm "gcr.io/${PROJECT_ID}/helpudoc-agent:${IMAGE_TAG}" officecli --version
          docker run --rm "gcr.io/${PROJECT_ID}/helpudoc-agent:${IMAGE_TAG}" \
            python /app/agent/scripts/smoke_officecli.py
          docker push "gcr.io/${PROJECT_ID}/helpudoc-agent:${IMAGE_TAG}"

      - name: Deploy Agent
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          kubectl -n helpudoc get deployment helpudoc-app >/dev/null
          AGENT_IMAGE="gcr.io/${PROJECT_ID}/helpudoc-agent:${IMAGE_TAG}"
          kubectl -n helpudoc set image deployment/helpudoc-app agent="${AGENT_IMAGE}"
          kubectl -n helpudoc patch deployment helpudoc-app --type=strategic -p '
            spec:
              template:
                spec:
                  containers:
                    - name: agent
                      startupProbe:
                        httpGet: {path: /ready, port: 8001}
                        periodSeconds: 5
                        failureThreshold: 120
                      readinessProbe:
                        httpGet: {path: /ready, port: 8001}
                        periodSeconds: 10
                        timeoutSeconds: 2
                        failureThreshold: 3
                      resources:
                        requests: {cpu: 800m, memory: 4Gi}
                        limits: {cpu: "2", memory: 9Gi}
                      env:
                        - name: OFFICE_SERVICE_URL
                          $patch: delete
                    - name: office-service
                      $patch: delete
                  volumes:
                    - name: office-service-tmp
                      $patch: delete
          '
          kubectl -n helpudoc patch deployment helpudoc-app --type=strategic -p "$(jq -n \
            --arg image "${AGENT_IMAGE}" \
            '{spec:{template:{spec:{initContainers:[
              {name:"seed-skills",image:$image},
              {name:"seed-plugins",image:$image},
              {name:"seed-agent-config",image:$image}
            ]}}}}')"
          kubectl -n helpudoc patch configmap helpudoc-config --type merge -p "$(jq -n \
            --arg image "${AGENT_IMAGE}" \
            '{data:{HELPUDOC_SANDBOX_IMAGE:$image}}')"
          kubectl -n helpudoc rollout status deployment/helpudoc-app --timeout=20m
          APP_POD="$(kubectl -n helpudoc get pods -l app=helpudoc-app -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | head -n1)"
          test -n "${APP_POD}"
          if ! kubectl -n helpudoc wait --for=condition=Ready "pod/${APP_POD}" --timeout=5m; then
            kubectl -n helpudoc describe "pod/${APP_POD}" || true
            kubectl -n helpudoc logs "pod/${APP_POD}" -c agent --tail=200 || true
            kubectl -n helpudoc logs "pod/${APP_POD}" -c agent --previous --tail=200 || true
            exit 1
          fi
          AGENT_READY="$(kubectl -n helpudoc get "pod/${APP_POD}" -o jsonpath='{.status.containerStatuses[?(@.name=="agent")].ready}')"
          if [[ "${AGENT_READY}" != "true" ]]; then
            kubectl -n helpudoc describe "pod/${APP_POD}" || true
            kubectl -n helpudoc logs "pod/${APP_POD}" -c agent --tail=200 || true
            kubectl -n helpudoc logs "pod/${APP_POD}" -c agent --previous --tail=200 || true
            exit 1
          fi

      - name: Gate direct OfficeCLI in the shared agent cgroup
        run: |
          set -euo pipefail
          APP_POD="$(kubectl -n helpudoc get pods -l app=helpudoc-app \
            -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.phase}{" "}{.status.containerStatuses[?(@.name=="agent")].ready}{"\n"}{end}' \
            | awk '$2 == "Running" && $3 == "true" {print $1; exit}')"
          test -n "${APP_POD}"
          RESTARTS_BEFORE="$(kubectl -n helpudoc get pod "${APP_POD}" \
            -o jsonpath='{.status.containerStatuses[?(@.name=="agent")].restartCount}')"
          kubectl -n helpudoc exec "${APP_POD}" -c agent -- \
            python /app/agent/scripts/smoke_officecli.py
          kubectl -n helpudoc exec "${APP_POD}" -c agent -- \
            env HELPUDOC_NON_DOCUMENT_P99_SLO_MS=50 \
            python /app/agent/scripts/gate_officecli_shared_cgroup.py
          RESTARTS_AFTER="$(kubectl -n helpudoc get pod "${APP_POD}" \
            -o jsonpath='{.status.containerStatuses[?(@.name=="agent")].restartCount}')"
          test "${RESTARTS_AFTER}" = "${RESTARTS_BEFORE}"

      - name: Sync Skills PVC
        run: |
          set -euo pipefail
          APP_POD="$(kubectl -n helpudoc get pods -l app=helpudoc-app -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.phase}{" "}{.status.containerStatuses[?(@.name=="agent")].ready}{"\n"}{end}' | awk '$2 == "Running" && $3 == "true" {print $1; exit}')"
          test -n "${APP_POD}"
          kubectl -n helpudoc exec "${APP_POD}" -c backend -- sh -lc "set -eu; mkdir -p /app/skills; find /app/skills -mindepth 1 -maxdepth 1 -exec rm -rf {} +"
          tar -C skills -cf - . | kubectl -n helpudoc exec -i "${APP_POD}" -c backend -- sh -lc "tar -xf - -C /app/skills"
          kubectl -n helpudoc exec "${APP_POD}" -c backend -- sh -lc "test -f /app/skills/research/SKILL.md"
