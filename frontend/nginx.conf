server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # The PDF.js worker is emitted as an ES module with a `.mjs` extension.
    # Nginx otherwise falls back to application/octet-stream, which browsers
    # reject when loading a dynamically imported module.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # Serve static assets with aggressive caching
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy API requests to the backend service on the Docker network
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Signed knowledge uploads remain same-origin while streaming directly to
    # private object storage. Disable proxy buffering so large files never sit
    # in the frontend or backend container.
    location /helpudoc/ {
        client_max_body_size 1024m;
        proxy_request_buffering off;
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so client-side routes like /login work
    location / {
        try_files $uri $uri/ /index.html;
    }
}
