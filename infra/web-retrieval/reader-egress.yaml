# Apply in the reader namespace. Match the labels of the actual reader, DNS and SearXNG pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: websearchfree-public-fetch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: websearchfree
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: searxng
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            # Add any publicly numbered cluster, node, service or corporate CIDRs here.
            except: [0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8,
                     169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24,
                     192.88.99.0/24, 192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24,
                     203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4]
      ports:
        - {protocol: TCP, port: 80}
        - {protocol: TCP, port: 443}
