apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helpudoc.fullname" . }}-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helpudoc.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  FRONTEND_URL: {{ .Values.publicUrl | quote }}
  AUTH_PROVIDER: {{ .Values.auth.provider | quote }}
  {{- if eq .Values.auth.provider "pcai-proxy" }}
  PCAI_SSO_ISSUER_URL: {{ .Values.auth.pcaiProxy.issuerUrl | quote }}
  PCAI_SSO_JWKS_URL: {{ .Values.auth.pcaiProxy.jwksUrl | quote }}
  PCAI_SSO_AUDIENCES: {{ join "," .Values.auth.pcaiProxy.audiences | quote }}
  PCAI_SSO_AUTHORIZED_PARTY: {{ .Values.auth.pcaiProxy.authorizedParty | quote }}
  PCAI_SSO_DISPLAY_NAME: {{ .Values.auth.pcaiProxy.displayName | quote }}
  PCAI_SSO_PORTAL_URL: {{ .Values.auth.pcaiProxy.portalUrl | quote }}
  {{- end }}
  {{- if eq .Values.auth.provider "oidc" }}
  OIDC_ISSUER_URL: {{ .Values.auth.oidc.issuerUrl | quote }}
  OIDC_CLIENT_ID: {{ .Values.auth.oidc.clientId | quote }}
  OIDC_DISPLAY_NAME: {{ .Values.auth.oidc.displayName | quote }}
  OIDC_REDIRECT_URI: {{ printf "%s/api/auth/oidc/callback" .Values.publicUrl | quote }}
  OIDC_POST_LOGOUT_REDIRECT_URI: {{ printf "%s/login" .Values.publicUrl | quote }}
  OIDC_LOGOUT_FROM_PROVIDER: {{ .Values.auth.oidc.logoutFromProvider | quote }}
  {{- end }}
  GOOGLE_OAUTH_POST_LOGIN_REDIRECT: {{ .Values.publicUrl | quote }}
  GOOGLE_OAUTH_REDIRECT_URI: {{ printf "%s/api/auth/google/callback" (.Values.publicUrl | trimSuffix "/") | quote }}
  POSTGRES_HOST: {{ ternary (printf "%s-postgres" (include "helpudoc.fullname" .)) .Values.postgres.externalHost .Values.postgres.enabled | quote }}
  POSTGRES_PORT: {{ .Values.postgres.port | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  {{- if .Values.redis.enabled }}
  REDIS_URL: {{ printf "redis://%s-redis:6379" (include "helpudoc.fullname" .) | quote }}
  {{- end }}
  BACKEND_INTERNAL_URL: {{ printf "http://%s-app:3000" (include "helpudoc.fullname" .) | quote }}
  S3_ENDPOINT: {{ include "helpudoc.s3Endpoint" . | quote }}
  MINIO_ENDPOINT: {{ include "helpudoc.s3Endpoint" . | quote }}
  S3_PUBLIC_ENDPOINT: {{ ternary .Values.publicUrl .Values.objectStore.externalPublicEndpoint .Values.objectStore.enabled | quote }}
  S3_BUCKET_NAME: {{ .Values.objectStore.bucket | quote }}
  S3_FORCE_PATH_STYLE: "true"
  OBJECT_STORE_PROVIDER: s3
  AWS_REGION: {{ .Values.objectStore.region | quote }}
  KNOWLEDGE_OCR_MODE: "off"
  {{- if .Values.trust.configMap }}
  SSL_CERT_FILE: /etc/helpudoc-ca/ca-bundle.crt
  REQUESTS_CA_BUNDLE: /etc/helpudoc-ca/ca-bundle.crt
  NODE_EXTRA_CA_CERTS: /etc/helpudoc-ca/ca-bundle.crt
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helpudoc.fullname" . }}-runtime-default
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helpudoc.labels" . | nindent 4 }}
data:
  runtime.yaml: |
    model:
      {{- toYaml .Values.model | nindent 6 }}
    {{- .Files.Get "files/runtime.yaml" | nindent 4 }}
