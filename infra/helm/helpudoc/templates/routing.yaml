{{- if .Values.ezua.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "helpudoc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helpudoc.labels" . | nindent 4 }}
spec:
  gateways: [{{ .Values.ezua.virtualService.istioGateway | quote }}]
  hosts: [{{ .Values.ezua.virtualService.endpoint | quote }}]
  http:
    - match: [{uri: {prefix: /}}]
      # Omit timeout to preserve streaming without a request deadline. PCAI's
      # installed CRD rejects an explicit zero duration.
      route:
        - destination:
            host: {{ include "helpudoc.fullname" . }}-gateway.{{ .Release.Namespace }}.svc.cluster.local
            port: {number: 80}
{{- if .Values.ezua.authorizationPolicy.enabled }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Namespace }}-{{ include "helpudoc.fullname" . }}-auth
  namespace: {{ .Values.ezua.authorizationPolicy.namespace }}
  labels:
    {{- include "helpudoc.labels" . | nindent 4 }}
spec:
  action: CUSTOM
  provider:
    name: {{ .Values.ezua.authorizationPolicy.providerName }}
  selector:
    matchLabels:
      {{- toYaml .Values.ezua.authorizationPolicy.matchLabels | nindent 6 }}
  rules:
    - to:
        - operation:
            hosts:
              - {{ .Values.ezua.virtualService.endpoint | quote }}
              - {{ printf "%s:*" .Values.ezua.virtualService.endpoint | quote }}
{{- end }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "helpudoc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helpudoc.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "helpudoc.fullname" . }}-gateway
                port: {number: 80}
{{- end }}
