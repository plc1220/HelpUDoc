{{- if and .Values.ezua.enabled .Values.ingress.enabled }}
{{- fail "Enable either ezua or ingress, not both" }}
{{- end }}
{{- if not (has .Values.auth.provider (list "oidc" "google")) }}
{{- fail "auth.provider must be oidc or google" }}
{{- end }}
{{- if eq .Values.auth.provider "oidc" }}
{{- if not (regexMatch "^https://[^/?#@]+(/[^?#]*)?$" .Values.auth.oidc.issuerUrl) }}
{{- fail "auth.oidc.issuerUrl must be the HTTPS Keycloak realm issuer URL" }}
{{- end }}
{{- if or (empty .Values.auth.oidc.clientId) (empty .Values.auth.oidc.existingSecret) (empty .Values.auth.oidc.clientSecretKey) }}
{{- fail "OIDC requires clientId and an existing Secret/key reference" }}
{{- end }}
{{- end }}
{{- range $key, $value := .Values.config }}
{{- if not (kindIs "string" $value) }}
{{- fail (printf "config.%s must be a quoted string" $key) }}
{{- end }}
{{- if or (eq $key "AUTH_PROVIDER") (hasPrefix "OIDC_" $key) }}
{{- fail (printf "config.%s is generated; use auth settings" $key) }}
{{- end }}
{{- if has $key (list "FRONTEND_URL" "GOOGLE_OAUTH_POST_LOGIN_REDIRECT" "GOOGLE_OAUTH_REDIRECT_URI" "POSTGRES_HOST" "POSTGRES_PORT" "POSTGRES_DB" "POSTGRES_USER" "REDIS_URL" "BACKEND_INTERNAL_URL" "S3_ENDPOINT" "MINIO_ENDPOINT" "S3_PUBLIC_ENDPOINT" "S3_BUCKET_NAME" "S3_FORCE_PATH_STYLE" "OBJECT_STORE_PROVIDER" "AWS_REGION" "KNOWLEDGE_OCR_MODE" "SSL_CERT_FILE" "REQUESTS_CA_BUNDLE" "NODE_EXTRA_CA_CERTS") }}
{{- fail (printf "config.%s is generated; use the corresponding chart setting" $key) }}
{{- end }}
{{- end }}
{{- if ne .Values.model.provider "openai-compatible" }}
{{- fail "This chart's local runtime requires model.provider=openai-compatible" }}
{{- end }}
{{- if .Values.ezua.autoHelm }}
{{- fail "This multi-service chart uses manual PCAI integration; ezua.autoHelm must be false" }}
{{- end }}
{{- if not (has .Values.config.AUTH_MODE (list "oidc" "hybrid")) }}
{{- fail "Use oidc or production hybrid auth; unverified header identity is not supported by this chart" }}
{{- end }}
{{- if or (ne .Values.config.ENABLE_SKILL_SANDBOX_RUNNER "false") (ne .Values.config.SANDBOX_INLINE_ENABLED "false") }}
{{- fail "Sandbox jobs require site-approved isolation/RBAC/runtime support; this chart keeps both runners disabled" }}
{{- end }}
{{- if ne (.Values.publicUrl | trimSuffix "/") .Values.publicUrl }}
{{- fail "publicUrl must not have a trailing slash" }}
{{- end }}
{{- if not (hasPrefix "https://" .Values.publicUrl) }}
{{- fail "publicUrl must use HTTPS (secure cookies and presigned browser uploads)" }}
{{- end }}
{{- if and .Values.ezua.enabled (ne .Values.publicUrl (printf "https://%s" .Values.ezua.virtualService.endpoint)) }}
{{- fail "publicUrl must equal https://ezua.virtualService.endpoint" }}
{{- end }}
{{- if and .Values.ingress.enabled (ne .Values.publicUrl (printf "https://%s" .Values.ingress.host)) }}
{{- fail "publicUrl must equal https://ingress.host" }}
{{- end }}
{{- if and .Values.ezua.authorizationPolicy.enabled (not .Values.ezua.enabled) }}
{{- fail "AuthorizationPolicy requires ezua.enabled" }}
{{- end }}
{{- if and .Values.ezua.authorizationPolicy.enabled (empty .Values.ezua.authorizationPolicy.matchLabels) }}
{{- fail "AuthorizationPolicy must select the site's ingress gateway labels" }}
{{- end }}
{{- if and (not .Values.postgres.enabled) (empty .Values.postgres.externalHost) }}
{{- fail "postgres.externalHost is required when bundled PostgreSQL is disabled" }}
{{- end }}
{{- if and .Values.postgres.enabled (ne (int .Values.postgres.port) 5432) }}
{{- fail "Bundled PostgreSQL listens on port 5432" }}
{{- end }}
{{- if and (not .Values.objectStore.enabled) (not (hasPrefix "https://" .Values.objectStore.externalPublicEndpoint)) }}
{{- fail "External storage requires an HTTPS objectStore.externalPublicEndpoint" }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$" .Values.objectStore.bucket) }}
{{- fail "objectStore.bucket must be a valid DNS-compatible S3 bucket name" }}
{{- end }}
