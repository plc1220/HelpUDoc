# Supply site-specific settings in a separate, private override file.
nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
existingSecret: helpudoc-secrets
publicUrl: https://helpudoc.example.com

ezua:
  enabled: false
  autoHelm: false
  appName: helpudoc
  virtualService:
    endpoint: helpudoc.example.com
    istioGateway: istio-system/ezaf-gateway
  authorizationPolicy:
    enabled: false
    namespace: istio-system
    providerName: oauth2-proxy
    matchLabels:
      istio: ingressgateway

# Generic Kubernetes alternative; do not enable alongside ezua.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: helpudoc.example.com
  tls: []

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

# The app stays at one replica: backend, worker and agent share writable files.
# Recreate avoids simultaneous writers and RWO multi-attach on upgrades.
app:
  images:
    backend: {repository: helpudoc/backend, tag: pcai-local-v1, pullPolicy: IfNotPresent}
    agent: {repository: helpudoc/agent, tag: pcai-local-v1, pullPolicy: IfNotPresent}
  resources:
    backend:
      requests: {cpu: 200m, memory: 384Mi}
      limits: {cpu: "1", memory: 1Gi}
    worker:
      requests: {cpu: 200m, memory: 384Mi}
      limits: {cpu: "1", memory: 1Gi}
    agent:
      requests: {cpu: 800m, memory: 4Gi}
      limits: {cpu: "2", memory: 9Gi}
  # Extra environment entries; use valueFrom.secretKeyRef for credentials.
  backendEnv: []
  workerEnv: []
  agentEnv: []

frontend:
  image: {repository: helpudoc/frontend, tag: pcai-local-v1, pullPolicy: IfNotPresent}
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}
gateway:
  image: {repository: caddy, tag: 2.9.1-alpine, pullPolicy: IfNotPresent}
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 200m, memory: 256Mi}

postgres:
  enabled: true
  image: {repository: postgres, tag: "16.8", pullPolicy: IfNotPresent}
  database: helpudoc
  username: helpudoc
  externalHost: ""
  port: 5432
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "1", memory: 2Gi}
redis:
  enabled: true
  image: {repository: redis, tag: 7.4.2-alpine, pullPolicy: IfNotPresent}
  # Set REDIS_URL in the existing Secret when enabled=false.
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
objectStore:
  enabled: true
  image:
    repository: docker.io/rustfs/rustfs
    digest: sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    tag: ""
    pullPolicy: IfNotPresent
  bucket: helpudoc
  region: us-east-1
  # Required when enabled=false. Public endpoint must support browser HTTPS access.
  externalEndpoint: ""
  externalPublicEndpoint: ""
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 4Gi}

# Claims are retained on uninstall. Empty storageClass uses the cluster default;
# use "-" for storageClassName: "". existingClaim skips creation.
persistence:
  storageClass: ""
  claims:
    workspace: {size: 20Gi, accessModes: [ReadWriteOnce], existingClaim: ""}
    skills: {size: 5Gi, accessModes: [ReadWriteOnce], existingClaim: ""}
    plugins: {size: 5Gi, accessModes: [ReadWriteOnce], existingClaim: ""}
    config: {size: 1Gi, accessModes: [ReadWriteOnce], existingClaim: ""}
    postgres: {size: 20Gi, accessModes: [ReadWriteOnce], existingClaim: ""}
    redis: {size: 5Gi, accessModes: [ReadWriteOnce], existingClaim: ""}
    objects: {size: 100Gi, accessModes: [ReadWriteOnce], existingClaim: ""}

# Non-secret shared environment. Values must be strings. Connection settings and
# fixed container ports/paths are generated by templates instead.
config:
  AUTH_MODE: oidc
  SESSION_NAME: helpudoc.sid
  SESSION_TTL_SECONDS: "604800"
  SESSION_COOKIE_SECURE: "true"
  KNOWLEDGE_DEDICATED_WORKER: "true"
  KNOWLEDGE_RETRIEVAL_MODE: lexical-graph
  KNOWLEDGE_VECTOR_ENABLED: "false"
  KNOWLEDGE_MULTIMODAL_EMBEDDINGS: "false"
  ENABLE_SKILL_SANDBOX_RUNNER: "false"
  SANDBOX_INLINE_ENABLED: "false"
  LANGFUSE_TRACING_ENABLED: "false"
  TEAM_CHAT_THREADS_ENABLED: "false"
  TEAM_CHAT_RELEASE_B_ENABLED: "false"

# Runtime config is supplied as a file, never copied from GKE production values.
# First boot seeds the chart's private runtime.yaml into a writable config PVC.
# Supply a site-owned ConfigMap containing runtime.yaml to override that file.
runtimeConfigMap: ""

# Private endpoint must implement OpenAI Chat Completions, streaming, tool calls,
# and function-calling structured output. Set IDs exactly as deployed in PCAI.
model:
  provider: openai-compatible
  name: deployed-model-id
  fast_name: deployed-model-id
  lite_name: deployed-model-id
  pro_name: deployed-model-id
  base_url: https://nim.pcai.example.com/v1
  api_key_env: OPENAI_API_KEY
  use_vertex_ai: false
  max_output_tokens: 4096
  lite_max_output_tokens: 4096
  pro_max_output_tokens: 8192

# Optional site CA bundle (PEM). The bundle should include all roots required by
# private inference and any approved integrations; never disable TLS validation.
trust:
  configMap: ""
  key: ca-bundle.crt

dailyReflection:
  enabled: false
  schedule: "15 0 * * *"
  timeZone: Asia/Kuala_Lumpur
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
