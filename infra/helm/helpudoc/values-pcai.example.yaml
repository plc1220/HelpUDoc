# Replace example.com, the storage class, registry and image tags with site values.
# This example contains no credentials. Keep actual overrides outside the repo.
publicUrl: https://helpudoc.pcai.example.com
existingSecret: helpudoc-secrets
auth:
  provider: pcai-proxy
  pcaiProxy:
    # Confirm issuer, aud and azp of the JWT forwarded by the installed proxy.
    # 'ua' is a starting example for the browser client, not a verified site aud.
    issuerUrl: https://keycloak.pcai.example.com/realms/UA
    jwksUrl: https://keycloak.pcai.example.com/realms/UA/protocol/openid-connect/certs
    audiences: [ua]
    authorizedParty: ua
    displayName: PCAI
    portalUrl: https://home.pcai.example.com/home
runtimeConfigMap: ""
imagePullSecrets:
  - name: harbor-pull
ezua:
  enabled: true
  autoHelm: false
  appName: helpudoc
  virtualService:
    endpoint: helpudoc.pcai.example.com
    istioGateway: istio-system/ezaf-gateway
  authorizationPolicy:
    enabled: true
    namespace: istio-system
    providerName: oauth2-proxy
    matchLabels: {istio: ingressgateway}
persistence:
  storageClass: pcai-storage-class
app:
  images:
    backend: {repository: harbor.pcai.example.com/helpudoc/backend, tag: pcai-sso-v1}
    agent: {repository: harbor.pcai.example.com/helpudoc/agent, tag: pcai-sso-v1}
frontend:
  image: {repository: harbor.pcai.example.com/helpudoc/frontend, tag: pcai-sso-v1}
model:
  base_url: https://nim.pcai.example.com/v1
  name: deployed-model-id
  fast_name: deployed-model-id
  lite_name: deployed-model-id
  pro_name: deployed-model-id
# For restricted egress, mirror gateway, postgres, redis and RustFS too.
