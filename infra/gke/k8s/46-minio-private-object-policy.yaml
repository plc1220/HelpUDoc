apiVersion: batch/v1
kind: Job
metadata:
  name: helpudoc-minio-private-object-policy
  namespace: helpudoc
  labels:
    app: helpudoc-minio-private-object-policy
    app.kubernetes.io/managed-by: gcp-cloud-build-deploy
spec:
  backoffLimit: 3
  # Completed Jobs are garbage-collected instead of lingering. A Job's `spec.template`
  # is immutable, so a Job left in the cluster makes the next change to this pod spec --
  # an image bump, an env change -- fail the whole deploy with "field is immutable".
  # That is what broke the deploy when the image moved to Quay: these Jobs had sat here
  # since the first bootstrap. Both bodies are idempotent, so re-running on a later
  # deploy is harmless and keeps the bucket policy reconciled.
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: helpudoc-minio-private-object-policy
        app.kubernetes.io/managed-by: gcp-cloud-build-deploy
    spec:
      restartPolicy: OnFailure
      containers:
        - name: enforce-private-object-policy
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: helpudoc-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: helpudoc-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: S3_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: helpudoc-config
                  key: S3_BUCKET_NAME
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                sleep 1
              done
              mc anonymous set none local/"$S3_BUCKET_NAME"
