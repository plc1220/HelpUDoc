apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpudoc-minio
  namespace: helpudoc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: helpudoc-minio
  template:
    metadata:
      labels:
        app: helpudoc-minio
    spec:
      containers:
        - name: minio
          # MinIO no longer serves images publicly: Docker Hub and Quay both answer
          # 401. A node only pulls when the pod lands on it, so the outage arrives at
          # the next node replacement (a GKE auto-upgrade did it on 2026-10-05).
          # Pull from our own registry instead. Cloud Build rewrites the project id.
          # This image also ships `mc`, so the setup Jobs in 43 and 46 use it too.
          image: gcr.io/ccob-my-ai-engine-dev/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          args: ["server", "/data", "--console-address", ":9001"]
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: helpudoc-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: helpudoc-secrets
                  key: MINIO_ROOT_PASSWORD
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: helpudoc
spec:
  selector:
    app: helpudoc-minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
