apiVersion: v1
kind: ConfigMap
metadata:
  name: helpudoc-caddy-config
  namespace: helpudoc
data:
  Caddyfile: |
    {
      auto_https off
    }

    :80 {
      encode gzip zstd
      route {
        @api path /api*
        reverse_proxy @api backend:3000 {
          header_up X-Forwarded-Proto https
        }
        @s3 path /helpudoc*
        reverse_proxy @s3 minio:9000 {
          # SigV4 signs the public hostname; preserve it through the proxy.
          header_up Host {http.request.host}
        }
        @apex host lc-demo.com
        redir @apex https://www.lc-demo.com{uri} permanent
        reverse_proxy helpudoc-frontend:80
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpudoc-caddy
  namespace: helpudoc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helpudoc-caddy
  template:
    metadata:
      labels:
        app: helpudoc-caddy
    spec:
      containers:
        - name: caddy
          image: caddy:2-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: caddy-data
              mountPath: /data
            - name: caddy-config-storage
              mountPath: /config
      volumes:
        - name: caddy-config
          configMap:
            name: helpudoc-caddy-config
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: helpudoc-caddy
  namespace: helpudoc
  annotations:
    cloud.google.com/backend-config: '{"default":"helpudoc-caddy-backendconfig"}'
    # The GCE Ingress reaches this Service through a container-native NEG.
    # Do not expose a second public L4 load balancer for Caddy.
    cloud.google.com/neg: '{"ingress":true}'
spec:
  type: ClusterIP
  selector:
    app: helpudoc-caddy
  ports:
    - name: http
      port: 80
      targetPort: 80
