apiVersion: v1
kind: ConfigMap
metadata:
  name: helpudoc-config
  namespace: helpudoc
data:
  SESSION_NAME: helpudoc.sid
  SESSION_TTL_SECONDS: "604800"
  AUTH_MODE: oidc
  POSTGRES_DB: helpudoc
  POSTGRES_USER: helpudoc
  S3_BUCKET_NAME: helpudoc
  S3_FORCE_PATH_STYLE: "true"
  WORKSPACE_ROOT: /app/workspaces
  AWS_REGION: us-east-1
  AWS_PRICING_MCP_LOG_LEVEL: ERROR
  ENABLE_SKILL_SANDBOX_RUNNER: "true"
  HELPUDOC_SANDBOX_BACKEND: kubernetes
  SANDBOX_INLINE_ENABLED: "false"
  SANDBOX_INLINE_MAX_GLOBAL_JOBS: "4"
  HELPUDOC_SANDBOX_IMAGE: gcr.io/my-rd-coe-demo-gen-ai/helpudoc-agent:latest
  # Route Gemini through Vertex AI (ADC) instead of the AI Studio key.
  # Overrides use_vertex_ai in runtime.yaml, so it works even when the
  # agent-config PVC copy is stale. Set to "false" to roll back.
  GOOGLE_GENAI_USE_VERTEXAI: "true"
  GOOGLE_CLOUD_LOCATION: asia-southeast1
  # BigQuery job location. Must match the region of the datasets being queried,
  # and of any `region-<name>.INFORMATION_SCHEMA` pseudo-dataset.
  BIGQUERY_LOCATION: asia-southeast1
