apiVersion: v1
kind: ConfigMap
metadata:
  name: helpudoc-config
  namespace: helpudoc
data:
  SESSION_NAME: helpudoc.sid
  SESSION_TTL_SECONDS: "604800"
  POSTGRES_DB: helpudoc
  POSTGRES_USER: helpudoc
  S3_BUCKET_NAME: helpudoc
  # Same-origin path; Caddy proxies this to the in-cluster MinIO service.
  S3_PUBLIC_BASE_URL: /helpudoc
  S3_FORCE_PATH_STYLE: "true"
  WORKSPACE_ROOT: /app/workspaces
  RAG_OFFLINE: "true"
  LLM_MODEL: gemini-3.5-flash
  # Route Gemini traffic through Vertex AI (ADC auth) instead of the AI Studio API key.
  GOOGLE_GENAI_USE_VERTEXAI: "true"
  GOOGLE_CLOUD_PROJECT: ccob-my-ai-engine-dev
  GOOGLE_CLOUD_LOCATION: ap-southeast-1
  AWS_REGION: us-east-1
  AWS_PRICING_MCP_LOG_LEVEL: ERROR
  ENABLE_SKILL_SANDBOX_RUNNER: "false"
  HELPUDOC_SANDBOX_IMAGE: gcr.io/ccob-my-ai-engine-dev/helpudoc-agent:latest
