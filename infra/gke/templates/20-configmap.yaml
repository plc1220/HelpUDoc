apiVersion: v1
kind: ConfigMap
metadata:
  name: helpudoc-config
  namespace: helpudoc
data:
  SESSION_NAME: helpudoc.sid
  SESSION_TTL_SECONDS: "604800"
  AUTH_MODE: oidc
  POSTGRES_DB: helpudoc
  POSTGRES_USER: helpudoc
  S3_BUCKET_NAME: helpudoc
  S3_FORCE_PATH_STYLE: "true"
  WORKSPACE_ROOT: /app/workspaces
  # In-cluster backend Service URL the agent uses for authenticated internal
  # callbacks (e.g. the scoped Team Chat thread-history reader). Backend and agent
  # share the helpudoc-app pod, but naming the Service is explicit and robust.
  BACKEND_INTERNAL_URL: http://backend:3000
  # Team Chat threads UI/context gate (Release A). Default OFF; enable per workspace
  # cohort only AFTER the backfill verification reports full readiness.
  TEAM_CHAT_THREADS_ENABLED: "false"
  # Release B work-history gate (separate, default-off; does not affect Release A).
  TEAM_CHAT_RELEASE_B_ENABLED: "false"
  AWS_REGION: us-east-1
  AWS_PRICING_MCP_LOG_LEVEL: ERROR
  ENABLE_SKILL_SANDBOX_RUNNER: "true"
  HELPUDOC_SANDBOX_BACKEND: kubernetes
  SANDBOX_INLINE_ENABLED: "false"
  SANDBOX_INLINE_MAX_GLOBAL_JOBS: "4"
  HELPUDOC_SANDBOX_IMAGE: gcr.io/my-rd-coe-demo-gen-ai/helpudoc-agent:latest
  HELPUDOC_INLINE_SANDBOX_IMAGE: gcr.io/my-rd-coe-demo-gen-ai/helpudoc-inline-sandbox:latest
  HELPUDOC_INLINE_SANDBOX_TRANSPORT: object_store
  HELPUDOC_SANDBOX_RUNTIME_CLASS: gvisor
