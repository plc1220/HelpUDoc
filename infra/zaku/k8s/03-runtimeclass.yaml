# gVisor RuntimeClass. Requires runsc + containerd-shim-runsc-v1 on the node and a
# "runsc" runtime in /etc/containerd/config.toml (see docs/zaku_steps.md, U8).
# Sandbox Jobs must use runtimeClassName: gvisor (49-skill-sandbox.yaml policy).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
