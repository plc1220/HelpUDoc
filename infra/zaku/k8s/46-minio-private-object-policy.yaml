apiVersion: batch/v1
kind: Job
metadata:
  name: helpudoc-minio-private-object-policy
  namespace: helpudoc
  labels:
    app: helpudoc-minio-private-object-policy
    app.kubernetes.io/managed-by: gcp-cloud-build-deploy
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: helpudoc-minio-private-object-policy
        app.kubernetes.io/managed-by: gcp-cloud-build-deploy
    spec:
      restartPolicy: OnFailure
      containers:
        - name: enforce-private-object-policy
          # RustFS client (rc), pinned. minio/mc no longer pulls from Docker Hub
          # or quay.io; this matches rustfs-setup in infra/docker-compose.dependencies.yml.
          image: docker.io/rustfs/rc:v0.1.37@sha256:7e93fd410a8fe51514f89373e093392c92095b98dc6140335fcfe956810c4c80
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: helpudoc-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: helpudoc-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: S3_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: helpudoc-config
                  key: S3_BUCKET_NAME
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              until rc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                sleep 1
              done
              rc bucket anonymous set private local/"$S3_BUCKET_NAME"
