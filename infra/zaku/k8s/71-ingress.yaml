# Zaku: ZStack's nginx ingress controller (IngressClass zstack-ingress). Entry point
# 10.3.100.105 (controller LoadBalancer Service, MetalLB). The ADDRESS column shows
# 10.3.100.103, the node IP, because the controller has no --publish-service.
# ZStack's own zstack-gateway Ingress takes host "*", so every rule here needs a host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helpudoc-ingress
  namespace: helpudoc
  annotations:
    # Replace GKE BackendConfig timeoutSec: 3600 for long agent streams
    # (/api/agent/runs/:id/stream).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Stream responses as they arrive instead of buffering them.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # nginx caps request bodies at 1m by default. The GKE load balancer has no
    # cap, and uploads go through Caddy to the backend and MinIO.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: zstack-ingress
  # TODO(U5b): enable once ZStack says where the certificate comes from.
  # tls:
  #   - hosts:
  #       - lumostudio.cloudmile-coe.com
  #       - langfuse.lumostudio.cloudmile-coe.com
  #     secretName: helpudoc-tls
  rules:
    - host: lumostudio.cloudmile-coe.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: helpudoc-caddy
                port:
                  number: 80
    - host: langfuse.lumostudio.cloudmile-coe.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: langfuse-web
                port:
                  number: 80
