# Canonical environment variable catalog for HelpUDoc.
# Used by operators and by scripts/validate-env (see backend npm run validate:env).
#
# Fields:
#   owner: backend | agent | frontend | shared
#   secret: true if the value must never be committed or logged
#   local: optional | recommended | required — for typical local dev (direct or compose)
#   prod: optional | recommended | required — for GKE / production
#   default: documented default when unset (string or empty)
#   description: human summary
#   deprecated_aliases: older names still read by code (prefer the primary name)

version: 1

variables:
  # --- Loader / process ---
  ENV_FILE:
    owner: shared
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Optional path to a dotenv file consumed by backend and agent before other config.

  NODE_ENV:
    owner: shared
    secret: false
    local: optional
    prod: recommended
    default: ""
    description: Node-style environment name; agent uses it for local/dev workspace validation and tracing tags.

  PORT:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: "3000"
    description: HTTP listen port for the backend API.

  COLLAB_PORT:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: "1234"
    description: Port for the Yjs collaboration WebSocket server.

  FRONTEND_URL:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Fallback public origin for OAuth post-login redirect when GOOGLE_OAUTH_POST_LOGIN_REDIRECT is unset.

  # --- Sessions ---
  SESSION_SECRET:
    owner: backend
    secret: true
    local: required
    prod: required
    default: "dev-secret-change-me"
    description: Secret for signing express-session cookies; must be strong in production.

  SESSION_NAME:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: helpudoc.sid
    description: Cookie name for the session id.

  SESSION_TTL_SECONDS:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: "604800"
    description: Session max age in seconds (rolling).

  SESSION_COOKIE_SECURE:
    owner: backend
    secret: false
    local: optional
    prod: recommended
    default: "true in production when NODE_ENV=production"
    description: Force Secure cookie flag; when unset, defaults from NODE_ENV.

  SESSION_COOKIE_DOMAIN:
    owner: backend
    secret: false
    local: optional
    prod: recommended
    default: ""
    description: Optional cookie Domain attribute for cross-subdomain sessions.

  SESSION_SAVE_UNINITIALIZED:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: "false"
    description: express-session saveUninitialized override.

  # --- Auth ---
  AUTH_MODE:
    owner: backend
    secret: false
    local: optional
    prod: required
    default: headers
    description: Backend auth mode (headers, hybrid, oidc, etc.).

  DEFAULT_USER_ID:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Default user id for header-auth local dev.

  DEFAULT_USER_NAME:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: Local User
    description: Display name for header-auth and collab when no session user.

  DEFAULT_USER_EMAIL:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Email for header-auth local dev.

  ADMIN_EMAILS:
    owner: backend
    secret: false
    local: optional
    prod: recommended
    default: ""
    description: Comma-separated admin emails for bootstrap RBAC.

  AGENT_JWT_SECRET:
    owner: shared
    secret: true
    local: optional
    prod: required
    default: ""
    description: Shared secret for agent JWT validation; must match between backend and agent in production.

  # --- Database ---
  DATABASE_URL:
    owner: shared
    secret: true
    local: recommended
    prod: recommended
    default: ""
    description: Postgres connection URL; when set, overrides discrete POSTGRES_* fields.

  DATABASE_SSL:
    owner: backend
    secret: false
    local: optional
    prod: recommended
    default: "false"
    description: SSL mode for Postgres (false, strict, allow, skip-verify).

  POSTGRES_HOST:
    owner: shared
    secret: false
    local: optional
    prod: optional
    default: localhost
    description: Postgres host when DATABASE_URL is unset.

  POSTGRES_PORT:
    owner: shared
    secret: false
    local: optional
    prod: optional
    default: "5432"
    description: Postgres port.

  POSTGRES_DB:
    owner: shared
    secret: false
    local: optional
    prod: optional
    default: helpudoc
    description: Postgres database name.

  POSTGRES_USER:
    owner: shared
    secret: false
    local: optional
    prod: optional
    default: helpudoc
    description: Postgres user.

  POSTGRES_PASSWORD:
    owner: shared
    secret: true
    local: required
    prod: required
    default: ""
    description: Postgres password.

  DB_POOL_MIN:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: "0"
    description: Knex pool minimum.

  DB_POOL_MAX:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: "10"
    description: Knex pool maximum.

  AGENT_STORE_DATABASE_URL:
    owner: agent
    secret: true
    local: optional
    prod: optional
    default: ""
    description: Optional dedicated DB URL for agent memory/checkpoint store.

  AGENT_STORE_USE_IN_MEMORY:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: ""
    description: When truthy, use in-memory agent store (tests/dev).

  # --- Redis ---
  REDIS_URL:
    owner: backend
    secret: false
    local: recommended
    prod: required
    default: redis://127.0.0.1:6379
    description: Redis URL for sessions and agent run streams.

  # --- Object storage ---
  OBJECT_STORE_PROVIDER:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: s3
    description: Durable object-store adapter. Use s3 for MinIO/AWS-compatible storage or gcs for native Google Cloud Storage.

  S3_BUCKET_NAME:
    owner: shared
    secret: false
    local: optional
    prod: required
    default: helpudoc
    description: S3/MinIO bucket for workspace files.

  S3_ENDPOINT:
    owner: shared
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Custom S3 API endpoint (e.g. MinIO).

  MINIO_ENDPOINT:
    owner: shared
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Deprecated alias for S3_ENDPOINT (still read).

  S3_FORCE_PATH_STYLE:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: "true when custom endpoint set"
    description: Path-style addressing for S3-compatible APIs.

  AWS_REGION:
    owner: shared
    secret: false
    local: optional
    prod: optional
    default: us-east-1
    description: AWS region string for S3 client configuration.

  AWS_ACCESS_KEY_ID:
    owner: shared
    secret: true
    local: optional
    prod: required
    default: ""
    description: S3 access key id.

  AWS_SECRET_ACCESS_KEY:
    owner: shared
    secret: true
    local: optional
    prod: required
    default: ""
    description: S3 secret key.

  AWS_SESSION_TOKEN:
    owner: shared
    secret: true
    local: optional
    prod: optional
    default: ""
    description: Optional temporary session token for AWS.

  MINIO_ROOT_USER:
    owner: shared
    secret: true
    local: optional
    prod: optional
    default: ""
    description: Deprecated alias for AWS_ACCESS_KEY_ID in local MinIO setups.

  MINIO_ROOT_PASSWORD:
    owner: shared
    secret: true
    local: optional
    prod: optional
    default: ""
    description: Deprecated alias for AWS_SECRET_ACCESS_KEY in local MinIO setups.

  GCS_BUCKET_NAME:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: S3_BUCKET_NAME
    description: Google Cloud Storage bucket used when OBJECT_STORE_PROVIDER=gcs.

  GCS_PROJECT_ID:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: GOOGLE_CLOUD_PROJECT
    description: Optional Google Cloud project override. GKE should normally discover this through Application Default Credentials.

  GCS_KEY_FILENAME:
    owner: backend
    secret: true
    local: optional
    prod: optional
    default: ""
    description: Optional service-account JSON file path for non-GKE development. Prefer Workload Identity in GKE.

  GCS_API_ENDPOINT:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Optional GCS-compatible API endpoint for adapter testing; leave unset for managed GCS.

  # --- Agent service ---
  AGENT_URL:
    owner: backend
    secret: false
    local: recommended
    prod: required
    default: http://localhost:8001
    description: Base URL for the FastAPI agent service.

  AGENT_CONFIG_PATH:
    owner: shared
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Path to agent runtime.yaml; repo-relative or absolute.

  AGENT_CONFIG_DIR:
    owner: shared
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Directory containing runtime.yaml when AGENT_CONFIG_PATH is unset.

  WORKSPACE_ROOT:
    owner: shared
    secret: false
    local: recommended
    prod: required
    default: ""
    description: Root directory for workspace files; overrides YAML in agent settings.

  SKILLS_ROOT:
    owner: shared
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Skills directory root; defaults to repo skills/ (read by backend and agent).

  PLUGINS_ROOT:
    owner: shared
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Plugin manifest directory root; defaults to repo plugins/ (read by backend and agent).

  ENABLE_SKILL_BUILDER_ASSISTANT:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: "true"
    description: Feature flag for skill builder assistant routes.

  ENABLE_GITHUB_SKILL_IMPORTER:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: "true"
    description: Feature flag for GitHub skill import.

  ENABLE_SKILL_SANDBOX_RUNNER:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: "false"
    description: Enable Kubernetes sandbox execution for skills.

  ENABLE_SKILL_SCRIPT_RUNNER:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Deprecated alias for ENABLE_SKILL_SANDBOX_RUNNER.

  # --- Google OAuth ---
  GOOGLE_OAUTH_CLIENT_ID:
    owner: backend
    secret: false
    local: optional
    prod: required
    default: ""
    description: Google OAuth web client id.

  GOOGLE_OAUTH_CLIENT_SECRET:
    owner: backend
    secret: true
    local: optional
    prod: required
    default: ""
    description: Google OAuth client secret.

  GOOGLE_OAUTH_REDIRECT_URI:
    owner: backend
    secret: false
    local: optional
    prod: required
    default: ""
    description: Registered OAuth redirect URI on the backend.

  GOOGLE_OAUTH_POST_LOGIN_REDIRECT:
    owner: backend
    secret: false
    local: optional
    prod: required
    default: ""
    description: Browser URL to open after successful OAuth (often frontend /login).

  GOOGLE_OAUTH_SCOPES:
    owner: backend
    secret: false
    local: optional
    prod: recommended
    default: ""
    description: Space or comma separated OAuth scopes; defaults to built-in set when empty.

  GOOGLE_WORKSPACE_MCP_URL:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Base URL for hosted Google Workspace MCP when used.

  GOOGLE_DEVELOPER_KNOWLEDGE_PROJECT_ID:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: ""
    description: GCP project hint for developer-knowledge integrations.

  OAUTH_TOKEN_ENCRYPTION_KEY:
    owner: backend
    secret: true
    local: optional
    prod: required
    default: ""
    description: 32-byte base64url key for encrypting stored OAuth refresh tokens.

  # --- LLM credentials (agent) ---
  GEMINI_API_KEY:
    owner: shared
    secret: true
    local: required
    prod: required
    default: ""
    description: API key for Gemini models used by the agent runtime.

  GOOGLE_API_KEY:
    owner: agent
    secret: true
    local: optional
    prod: optional
    default: ""
    description: Alternate env name for Gemini API key in some code paths.

  GOOGLE_CLOUD_API_KEY:
    owner: agent
    secret: true
    local: optional
    prod: optional
    default: ""
    description: Used by some Gemini tooling as an API key source.

  CURRENT_TURN_MULTIMODAL_MAX_BYTES:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Cap multimodal attachment bytes for current-turn proxying.

  # --- Knowledge ingestion and retrieval ---
  KNOWLEDGE_ENRICHMENT_MODE:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: gemini-lite
    description: Enrichment profile used for Knowledge ingestion runs.

  KNOWLEDGE_MAP_CONCURRENCY:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: "4"
    description: Maximum concurrent Gemini map-enrichment requests per ingestion run.

  KNOWLEDGE_MARKITDOWN_MODE:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: primary
    description: MarkItDown conversion policy for supported Knowledge documents.

  KNOWLEDGE_OCR_MODE:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: auto
    description: OCR selection policy for Knowledge documents (auto, always, or disabled).

  KNOWLEDGE_OCR_TEXT_THRESHOLD:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: "40"
    description: Minimum extracted text used to decide whether a page needs OCR in auto mode.

  KNOWLEDGE_OCR_BATCH_SIZE:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: "6"
    description: Maximum number of rendered pages submitted in one OCR batch.

  KNOWLEDGE_OCR_CONCURRENCY:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: "4"
    description: Maximum concurrent OCR requests for one Knowledge ingestion process.

  KNOWLEDGE_DEDICATED_WORKER:
    owner: backend
    secret: false
    local: optional
    prod: recommended
    default: "false locally; true in production"
    description: Process durable Knowledge jobs in the dedicated worker instead of the API process.

  KNOWLEDGE_WORKER_CONCURRENCY:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: "2"
    description: Maximum number of durable Knowledge jobs processed concurrently by a worker.

  KNOWLEDGE_RETRIEVAL_MODE:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: lexical-graph
    description: Retrieval strategy used for tagged OKF bundles.

  KNOWLEDGE_VECTOR_ENABLED:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: "false"
    description: Enable pgvector-backed Knowledge embeddings and vector retrieval.

  KNOWLEDGE_MULTIMODAL_EMBEDDINGS:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: "false"
    description: Enable optional page-level multimodal embeddings during Knowledge ingestion.

  KNOWLEDGE_EMBEDDING_MODEL:
    owner: shared
    secret: false
    local: optional
    prod: optional
    default: gemini-embedding-2
    description: Gemini embedding model used to index Knowledge content.

  KNOWLEDGE_EMBEDDING_DIMENSIONS:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: "768"
    description: Vector dimensionality stored for Knowledge embeddings.

  KNOWLEDGE_RATE_CARD_VERSION:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: gemini-flash-lite-2026-08
    description: Version label attached to Knowledge model-cost estimates.

  KNOWLEDGE_GEMINI_INPUT_USD_PER_MILLION:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: "0.25"
    description: Rate-card price for one million uncached Gemini input tokens.

  KNOWLEDGE_GEMINI_CACHED_INPUT_USD_PER_MILLION:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: "0.025"
    description: Rate-card price for one million cached Gemini input tokens.

  KNOWLEDGE_GEMINI_OUTPUT_USD_PER_MILLION:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: "1.50"
    description: Rate-card price for one million Gemini output tokens.

  # --- Langfuse ---
  LANGFUSE_ENABLED:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Agent-side toggle for Langfuse callbacks.

  LANGFUSE_TRACING_ENABLED:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Deprecated alias read by agent for Langfuse enablement.

  LANGFUSE_PUBLIC_KEY:
    owner: shared
    secret: true
    local: optional
    prod: optional
    default: ""
    description: Langfuse public API key.

  LANGFUSE_SECRET_KEY:
    owner: shared
    secret: true
    local: optional
    prod: optional
    default: ""
    description: Langfuse secret API key.

  LANGFUSE_BASE_URL:
    owner: shared
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Langfuse API base URL (self-hosted or cloud).

  LANGFUSE_HOST:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Deprecated alias for LANGFUSE_BASE_URL in agent.

  LANGFUSE_NEXTAUTH_URL:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Public Langfuse UI origin for workspace overview links.

  # --- Analytics / jobs ---
  ANALYTICS_TIMEZONE:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: UTC
    description: IANA timezone for daily reflection analytics.

  # --- Debugging ---
  DEBUG_AGENT_RUN_STREAM:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: "false"
    description: Verbose logging for agent run SSE proxying.

  AGENT_RESUME_IDLE_TIMEOUT_MS:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Idle timeout for resume polling in agent run service.

  # --- Skill sandbox (Kubernetes) ---
  HELPUDOC_SANDBOX_NAMESPACE:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: ""
    description: K8s namespace for skill sandbox Jobs.

  HELPUDOC_SANDBOX_BACKEND:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: auto
    description: "Skill script execution backend: local, kubernetes, or auto."

  SANDBOX_INLINE_ENABLED:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: "false"
    description: Opt-in switch for agent-authored inline Python in isolated Kubernetes sandbox Jobs. Local execution remains unavailable.

  SANDBOX_INLINE_MAX_GLOBAL_JOBS:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: "4"
    description: Maximum inline sandbox Jobs active across one agent process.

  POD_NAMESPACE:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Fallback namespace from downward API.

  HELPUDOC_SANDBOX_IMAGE:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: gcr.io/my-rd-coe-demo-gen-ai/helpudoc-agent:latest
    description: Container image for sandbox skill runs. Must include workbook dependencies such as openpyxl and LibreOffice for XLSX skills.

  HELPUDOC_SANDBOX_WORKSPACE_PVC:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: workspace-pvc
    description: PVC name mounted into sandbox pods.

  HELPUDOC_SANDBOX_RUNTIME_CLASS:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: gvisor
    description: Kubernetes runtimeClassName for gVisor isolation.

  HELPUDOC_SANDBOX_CPU_LIMIT:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: 500m
    description: CPU limit for sandbox pods.

  HELPUDOC_SANDBOX_MEMORY_LIMIT:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: 512Mi
    description: Memory limit for sandbox pods.

  HELPUDOC_SANDBOX_EPHEMERAL_STORAGE_LIMIT:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: 1Gi
    description: Ephemeral storage limit for sandbox pods.

  HELPUDOC_SANDBOX_POLL_INTERVAL_SECONDS:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: "1"
    description: Poll interval when waiting for sandbox Job completion.

  HELPUDOC_SANDBOX_ALLOW_KUBECONFIG:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: "false"
    description: Dangerous dev escape hatch to use kubeconfig from the agent process.

  # --- BigQuery / GCP tooling ---
  GOOGLE_CLOUD_PROJECT:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Default GCP project for BigQuery export tools.

  BIGQUERY_LOCATION:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: ""
    description: BigQuery location for export tools.

  BQ_ACCESS_TOKEN:
    owner: agent
    secret: true
    local: optional
    prod: optional
    default: ""
    description: Optional short-lived BigQuery OAuth access token for tools.

  GOOGLE_GENAI_USE_VERTEXAI:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Example overlay for Vertex AI routing.

  GOOGLE_CLOUD_LOCATION:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Example overlay for Vertex region.

  IMAGE_GEN_MODEL:
    owner: agent
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Example overlay for image generation model id.

  IMAGE_GEN_API_KEY:
    owner: agent
    secret: true
    local: optional
    prod: optional
    default: ""
    description: Example overlay API key for image generation.

  AWS_PRICING_MCP_LOG_LEVEL:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Log level for AWS pricing MCP integration.

  GCP_COST_SERVICE_ACCOUNT_JSON:
    owner: backend
    secret: true
    local: optional
    prod: optional
    default: ""
    description: JSON for GCP cost tooling service account.

  GCP_COST_SERVICE_ACCOUNT_JSON_B64:
    owner: backend
    secret: true
    local: optional
    prod: optional
    default: ""
    description: Base64-encoded service account JSON for cost tooling.

  # --- Langfuse bootstrap (GKE templates) ---
  LANGFUSE_INIT_ORG_ID:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Headless Langfuse org id seed.

  LANGFUSE_INIT_ORG_NAME:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Headless Langfuse org name seed.

  LANGFUSE_INIT_PROJECT_ID:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Headless Langfuse project id seed.

  LANGFUSE_INIT_PROJECT_NAME:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Headless Langfuse project name seed.

  LANGFUSE_INIT_USER_EMAIL:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Headless Langfuse admin email seed.

  LANGFUSE_INIT_USER_NAME:
    owner: backend
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Headless Langfuse admin display name seed.

  LANGFUSE_INIT_USER_PASSWORD:
    owner: backend
    secret: true
    local: optional
    prod: optional
    default: ""
    description: Headless Langfuse admin password seed.

  LANGFUSE_NEXTAUTH_SECRET:
    owner: backend
    secret: true
    local: optional
    prod: optional
    default: ""
    description: NextAuth secret for Langfuse deployment.

  LANGFUSE_SALT:
    owner: backend
    secret: true
    local: optional
    prod: optional
    default: ""
    description: Langfuse salt for credential hashing.

  LANGFUSE_ENCRYPTION_KEY:
    owner: backend
    secret: true
    local: optional
    prod: optional
    default: ""
    description: Langfuse encryption key (64 hex chars for v3).

  CLICKHOUSE_PASSWORD:
    owner: backend
    secret: true
    local: optional
    prod: optional
    default: ""
    description: ClickHouse password bundled with Langfuse on GKE.

  # --- Frontend (Vite) ---
  VITE_API_URL:
    owner: frontend
    secret: false
    local: optional
    prod: required
    default: "/api (frontend Dockerfile.gke / GKE); http://localhost:3000/api (local Vite + dev backend)"
    description: >
      Browser-accessible backend API base URL. Local `npm run dev` typically uses
      http://localhost:3000/api. Production and container image builds default to same-origin
      `/api` (see frontend Dockerfile.gke `ARG VITE_API_URL=/api`) so the SPA talks to the API
      behind the ingress without hard-coding a host.

  VITE_AUTH_MODE:
    owner: frontend
    secret: false
    local: optional
    prod: required
    default: hybrid
    description: Must align with backend AUTH_MODE semantics for login UX.

  VITE_COLLAB_URL:
    owner: frontend
    secret: false
    local: optional
    prod: optional
    default: ws://localhost:1234
    description: Collaboration WebSocket URL.

  VITE_GOOGLE_CLIENT_ID:
    owner: frontend
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Google OAuth client id for the SPA (public).

  VITE_DEBUG_STREAM:
    owner: frontend
    secret: false
    local: optional
    prod: optional
    default: ""
    description: Enables verbose stream debugging in the browser console.
